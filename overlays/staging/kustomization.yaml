# overlays/staging/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: multistate-staging

images:
  - name: uptimecrew/multistate-api
    newName: uptimecrew/multistate-api
    newTag: 0.1.1

# Staging runs two replicas.
replicas:
  - name: multistate-api
    count: 2

# The base ConfigMap's hostnames are baked for multistate-dev; every
# in-cluster DNS name here must be rewritten to multistate-staging or
# the app can't reach its own dependencies in this namespace.
patches:
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: k8s-staging
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: INFO
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.multistate-staging.svc.cluster.local:5432/multistate_dev
      - op: replace
        path: /data/SPRING_DATA_REDIS_HOST
        value: redis.multistate-staging.svc.cluster.local
      - op: replace
        path: /data/SPRING_DATA_MONGODB_URI
        value: mongodb://mongo.multistate-staging.svc.cluster.local:27017/multistate
      - op: replace
        path: /data/SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.multistate-staging.svc.cluster.local:9092
      - op: replace
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otelcol.multistate-staging.svc.cluster.local:4318
  - target:
      kind: Namespace
      name: multistate-dev
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: multistate-dev
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
