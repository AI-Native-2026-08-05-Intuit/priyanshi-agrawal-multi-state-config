# overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: multistate-prod

images:
  - name: uptimecrew/multistate-api
    newName: uptimecrew/multistate-api
    newTag: 0.1.1

# Prod's real target is three replicas. TEMPORARILY reduced to 1 for
# local k3d verification only - this shared 2 CPU / 5.8 GB self-hosted
# runner's Docker VM reliably enters memory-pressure thrashing (CoreDNS
# CrashLoopBackOff, kubelet API timeouts, load average 300-450+) within
# minutes of prod's 3-replica footprint joining dev+staging. A real EKS
# cluster (W6 D3) doesn't have this ceiling. Revert to 3 there.
replicas:
  - name: multistate-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: k8s-prod
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: WARN
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.multistate-prod.svc.cluster.local:5432/multistate_dev
      - op: replace
        path: /data/SPRING_DATA_REDIS_HOST
        value: redis.multistate-prod.svc.cluster.local
      - op: replace
        path: /data/SPRING_DATA_MONGODB_URI
        value: mongodb://mongo.multistate-prod.svc.cluster.local:27017/multistate
      - op: replace
        path: /data/SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.multistate-prod.svc.cluster.local:9092
      - op: replace
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otelcol.multistate-prod.svc.cluster.local:4318
  - target:
      kind: Namespace
      name: multistate-dev
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: multistate-dev
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
