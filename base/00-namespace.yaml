# base/00-namespace.yaml - the bounded blast radius for multistate-api.
#
# ResourceQuota + LimitRange are DELIBERATELY NOT here. The AppProject's
# namespaceResourceBlacklist (argocd/projects/multistate.yaml) denies both
# kinds on purpose - quota/limit defaults are platform-team owned, applied
# out-of-band by the platform's own tooling, not by an app-team-controlled
# GitOps Application. Bundling them here would make every sync fail.

apiVersion: v1
kind: Namespace
metadata:
  name: multistate-dev
  labels:
    app.kubernetes.io/part-of: multistate
