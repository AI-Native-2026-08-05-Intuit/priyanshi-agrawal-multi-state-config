# base/kustomization.yaml
# W5 D3 manifests copied verbatim from the application repo. Kept
# identical across envs; overlays/{dev,staging,prod} patch namespace,
# replicas, image tag, and ConfigMap values on top of this base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 05-postgres.yaml
  - 06-mongo.yaml
  - 07-kafka.yaml
  - 10-multistate-api.deployment.yaml
  - 20-multistate-api.service.yaml
  - 30-multistate-api.configmap.yaml
  - 40-multistate-api.secret.yaml
  - 50-multistate-api.hpa.yaml
  - 65-multistate-api.ingress.yaml

# 60-multistate-api.servicemonitor.yaml is intentionally NOT listed here.
# The ServiceMonitor CRD (prometheus-operator) isn't installed on this
# cluster - that's W5 D5's observability stack, out of scope for today's
# GitOps cutover. SkipDryRunOnMissingResource=true on the Application
# only skips dry-run validation, not the actual apply, so a genuinely
# unregistered API kind still fails the sync. Re-add once the operator
# is installed on whichever cluster runs this Application.
